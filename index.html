<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>納品準備 連続QR読み取り</title>
  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbweWMFqN25S2Qz7cl9bH5gnyuKebUmAnoLvxd9IqMUyGMtCUHKekB7jNiSesAp79uE7/exec';
  </script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --green: #087a55;
      --red: #bd3b32;
      --blue: #1769aa;
      --yellow: #a06400;
      --ink: #172033;
      --muted: #5d6b7e;
      --line: #d9e2ec;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f2f5f8; color: var(--ink); }
    main { width: 100%; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
    h1 { margin: 5px 0 12px; text-align: center; font-size: clamp(1.35rem, 6vw, 1.85rem); }
    h2 { margin: 22px 2px 10px; font-size: 1.2rem; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button, .button { min-height: 52px; border: 0; border-radius: 11px; padding: 12px 8px; font: inherit; font-weight: 900; text-align: center; text-decoration: none; cursor: pointer; }
    button:disabled { opacity: .48; cursor: default; }
    .input-button { background: var(--green); color: #fff; }
    .cancel-button { background: var(--red); color: #fff; }
    .stop-button { grid-column: 1 / -1; border: 2px solid #526176; background: #fff; color: #344256; }
    .mode-button.active { outline: 4px solid #f2c94c; outline-offset: 2px; }
    .mode-status { margin: 12px 0 0; border-radius: 10px; background: #e8eef5; padding: 10px; text-align: center; font-weight: 900; }
    .mode-status.input { background: #dcfce7; color: #126b39; }
    .mode-status.cancel { background: #fee2e2; color: #991b1b; }
    .camera-panel { position: relative; min-height: 260px; margin-top: 12px; overflow: hidden; border: 2px solid #b8c4d1; border-radius: 15px; background: #101820; }
    #reader { width: 100%; min-height: 260px; color: #fff; }
    #reader video { display: block !important; width: 100% !important; min-height: 260px; object-fit: cover; }
    #cameraPlaceholder { position: absolute; z-index: 2; inset: 0; display: grid; min-height: 260px; place-items: center; padding: 20px; background: #101820; color: #fff; text-align: center; font-weight: 800; }
    #cameraPlaceholder[hidden] { display: none; }
    .scan-flash { position: absolute; z-index: 5; inset: 0; display: grid; place-items: center; color: #24dc73; font-size: clamp(8rem, 42vw, 14rem); font-weight: 900; line-height: 1; opacity: 0; pointer-events: none; text-shadow: 0 0 10px #fff, 0 0 24px rgba(0, 0, 0, .65); transform: scale(.65); }
    .scan-flash.show { animation: scan-confirmation .72s ease-out; }
    @keyframes scan-confirmation {
      0% { opacity: 0; transform: scale(.65); }
      18% { opacity: 1; transform: scale(1.08); }
      68% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.18); }
    }
    .notice { min-height: 24px; margin: 10px 2px 0; text-align: center; font-weight: 800; }
    .notice.info { color: var(--blue); }
    .notice.error { color: #b42318; }
    .latest { border: 2px solid #9aa9b8; border-left-width: 10px; border-radius: 15px; background: #fff; padding: 18px 15px; box-shadow: 0 4px 15px rgba(15, 23, 42, .08); }
    .latest.empty { color: var(--muted); text-align: center; }
    .latest.reading, .latest.resolving { border-color: #738395; background: #eef2f7; }
    .latest.success { border-color: var(--green); background: #ecfdf3; }
    .latest.duplicate { border-color: var(--blue); background: #eff7ff; }
    .latest.cancel_success { border-color: var(--red); background: #fff1f0; }
    .latest.cancel_not_done, .latest.not_target { border-color: #d39823; background: #fff8df; }
    .latest.invalid_format, .latest.not_found, .latest.error, .latest.failure, .latest.jsonp_error { border-color: var(--red); background: #fff1f0; }
    .latest-order { margin: 0; font-size: clamp(1.55rem, 8vw, 2.25rem); font-weight: 900; overflow-wrap: anywhere; }
    .latest-message { margin: 9px 0; font-size: 1.2rem; font-weight: 800; line-height: 1.45; }
    .latest-code { display: inline-block; border-radius: 999px; background: rgba(255, 255, 255, .75); padding: 5px 11px; font-family: ui-monospace, monospace; font-weight: 800; }
    .history { display: grid; gap: 9px; }
    .history-empty { border-radius: 12px; background: #e8eef5; padding: 18px; color: var(--muted); text-align: center; }
    .history-item { border: 1px solid var(--line); border-left: 6px solid #738395; border-radius: 12px; background: #fff; padding: 12px; }
    .history-item.success { border-left-color: var(--green); }
    .history-item.duplicate { border-left-color: var(--blue); }
    .history-item.cancel_success, .history-item.invalid_format, .history-item.not_found, .history-item.error, .history-item.failure, .history-item.jsonp_error { border-left-color: var(--red); }
    .history-item.cancel_not_done, .history-item.not_target { border-left-color: #d39823; }
    .history-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .history-order { font-size: 1.12rem; font-weight: 900; overflow-wrap: anywhere; }
    .history-time { flex: 0 0 auto; color: var(--muted); font-size: .82rem; }
    .history-message { margin: 7px 0; line-height: 1.4; }
    .history-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .84rem; font-weight: 800; }
    .progress-button { display: block; width: 100%; margin-top: 22px; border: 2px solid var(--blue); background: #fff; color: var(--blue); }
    @media (min-width: 620px) {
      main { max-width: 700px; margin: 0 auto; padding-right: 20px; padding-left: 20px; }
      .controls { grid-template-columns: 1fr 1fr 1fr; }
      .stop-button { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main>
    <h1>納品準備 連続QR読み取り</h1>

    <section class="controls" aria-label="カメラ操作">
      <button id="inputButton" class="mode-button input-button" type="button">読取</button>
      <button id="cancelButton" class="mode-button cancel-button" type="button">取消</button>
      <button id="stopButton" class="stop-button" type="button" disabled>カメラ停止</button>
    </section>
    <p id="modeStatus" class="mode-status">モードを選択してください</p>

    <section class="camera-panel" aria-label="カメラ映像">
      <div id="cameraPlaceholder">「読取」または「取消」を押すとカメラが起動します</div>
      <div id="reader"></div>
      <div id="scanFlash" class="scan-flash" aria-hidden="true">〇</div>
    </section>
    <p id="notice" class="notice" aria-live="polite"></p>

    <h2>直近結果</h2>
    <section id="latestResult" class="latest empty" aria-live="polite">まだ読み取り結果はありません</section>

    <h2>履歴（直近30件）</h2>
    <section id="historyList" class="history">
      <div class="history-empty">履歴はありません</div>
    </section>

    <a id="progressButton" class="button progress-button" href="#">進捗確認</a>
  </main>

  <script>
    const inputButton = document.getElementById('inputButton');
    const cancelButton = document.getElementById('cancelButton');
    const stopButton = document.getElementById('stopButton');
    const modeStatus = document.getElementById('modeStatus');
    const cameraPlaceholder = document.getElementById('cameraPlaceholder');
    const scanFlash = document.getElementById('scanFlash');
    const notice = document.getElementById('notice');
    const latestResult = document.getElementById('latestResult');
    const historyList = document.getElementById('historyList');
    const progressButton = document.getElementById('progressButton');

    let scanner = null;
    let cameraRunning = false;
    let cameraStarting = false;
    let currentAction = '';
    let isProcessing = false;
    let lastScanKey = '';
    let lastScanAt = 0;
    let cooldownUntil = 0;
    let callbackSequence = 0;
    let audioContext = null;
    const history = [];

    inputButton.addEventListener('click', function() { selectMode('input'); });
    cancelButton.addEventListener('click', function() { selectMode('cancel'); });
    stopButton.addEventListener('click', stopCamera);
    progressButton.href = buildGasUrl({ mode: 'mobileProgress' });
    progressButton.addEventListener('click', function(event) {
      if (!isConfigured()) {
        event.preventDefault();
        showNotice('GAS_WEB_APP_URLを設定してください。', 'error');
      }
    });
    scanFlash.addEventListener('animationend', function() {
      scanFlash.classList.remove('show');
    });

    function normalizeOrderNo(value) {
      return String(value == null ? '' : value)
        .trim()
        .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(character) {
          return String.fromCharCode(character.charCodeAt(0) - 0xFEE0);
        })
        .toUpperCase();
    }

    function isConfigured() {
      return /^https:\/\//.test(GAS_WEB_APP_URL) && GAS_WEB_APP_URL.indexOf('ここに') === -1;
    }

    function buildGasUrl(params) {
      const query = Object.keys(params).map(function(key) {
        return encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
      }).join('&');
      return GAS_WEB_APP_URL + (GAS_WEB_APP_URL.indexOf('?') === -1 ? '?' : '&') + query;
    }

    async function selectMode(action) {
      currentAction = action;
      updateModeDisplay();
      prepareAudio();

      if (!isConfigured()) {
        showNotice('GAS_WEB_APP_URLを設定してください。', 'error');
        return;
      }
      if (cameraRunning || cameraStarting) {
        showNotice((action === 'cancel' ? '取消' : '読取') + 'モードに切り替えました。', 'info');
        return;
      }
      await startCamera();
    }

    function updateModeDisplay() {
      const isCancel = currentAction === 'cancel';
      inputButton.classList.toggle('active', currentAction === 'input');
      cancelButton.classList.toggle('active', isCancel);
      modeStatus.className = 'mode-status ' + (currentAction || '');
      modeStatus.textContent = currentAction
        ? (isCancel ? '取消モード' : '読取モード')
        : 'モードを選択してください';
    }

    async function startCamera() {
      cameraStarting = true;
      showNotice('カメラを起動しています…', 'info');
      try {
        if (typeof Html5Qrcode === 'undefined') throw new Error('html5-qrcode is not available');
        scanner = new Html5Qrcode('reader');
        cameraPlaceholder.hidden = true;
        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: function(width, height) {
              const size = Math.floor(Math.min(width, height) * 0.72);
              return { width: size, height: size };
            }
          },
          handleDecoded,
          function() {}
        );
        cameraRunning = true;
        stopButton.disabled = false;
        showNotice('QRコードを枠内に映してください。', 'info');
      } catch (error) {
        if (scanner) {
          try { scanner.clear(); } catch (clearError) {}
        }
        scanner = null;
        cameraPlaceholder.hidden = false;
        showNotice('カメラを起動できません。ブラウザのカメラ権限を確認してください。', 'error');
      } finally {
        cameraStarting = false;
      }
    }

    async function stopCamera() {
      if (!scanner || !cameraRunning) return;
      stopButton.disabled = true;
      try { await scanner.stop(); } catch (error) {}
      try { scanner.clear(); } catch (error) {}
      scanner = null;
      cameraRunning = false;
      cameraPlaceholder.hidden = false;
      showNotice('カメラを停止しました。', 'info');
    }

    function handleDecoded(decodedText) {
      if (!currentAction) return;
      const now = Date.now();
      if (isProcessing || now < cooldownUntil) return;

      const orderNo = normalizeOrderNo(decodedText);
      const scanKey = currentAction + ':' + orderNo;
      if (scanKey === lastScanKey && now - lastScanAt < 2000) return;

      lastScanKey = scanKey;
      lastScanAt = now;
      const action = currentAction;

      if (!orderNo) {
        const invalidResult = {
          ok: false,
          orderNo: '',
          message: '読み取り値が空です',
          code: 'invalid_format',
          timestamp: formatCurrentTime()
        };
        displayResult(invalidResult, action);
        cooldownUntil = Date.now() + 800;
        return;
      }

      showScanConfirmation();
      isProcessing = true;
      showPendingResult(orderNo, action);
      showNotice(orderNo + ' を照合しています…', 'info');
      requestJsonp(orderNo, action)
        .then(function(payload) {
          displayResult(payload, action);
          showNotice('次のQRを読み取れます。', 'info');
        })
        .catch(function() {
          displayResult({
            ok: false,
            orderNo: orderNo,
            message: 'GASとの通信に失敗しました。通信状態を確認してください。',
            code: 'jsonp_error',
            result: 'jsonp_error',
            timestamp: formatCurrentTime()
          }, action);
          showNotice('通信に失敗しました。次のQRを読み取れます。', 'error');
        })
        .finally(function() {
          isProcessing = false;
          cooldownUntil = Date.now() + 800;
        });
    }

    function requestJsonp(orderNo, action) {
      return new Promise(function(resolve, reject) {
        callbackSequence += 1;
        const callbackName = '_deliveryPrepCb' + Date.now() + '_' + callbackSequence;
        const script = document.createElement('script');
        let settled = false;
        let timer;

        function cleanup() {
          clearTimeout(timer);
          script.remove();
          try { delete window[callbackName]; } catch (error) { window[callbackName] = undefined; }
        }

        window[callbackName] = function(payload) {
          if (settled) return;
          settled = true;
          cleanup();
          resolve(payload);
        };

        script.onerror = function() {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error('JSONP request failed'));
        };
        script.src = buildGasUrl({
          mode: 'apiScanJsonp',
          action: action,
          orderNo: orderNo,
          callback: callbackName
        });
        script.async = true;
        timer = setTimeout(function() {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error('JSONP request timed out'));
        }, 15000);
        document.body.appendChild(script);
      });
    }

    function displayResult(payload, action) {
      payload = payload || {};
      const code = normalizeResultCode(payload.code || payload.result || 'failure');
      const orderNo = payload.orderNo || '（注文番号なし）';
      const result = {
        ok: payload.ok === true,
        orderNo: String(orderNo),
        message: getDisplayMessage(code, payload.message),
        code: code,
        timestamp: String(payload.timestamp || formatCurrentTime()),
        actionLabel: action === 'cancel' ? '取消' : '読取'
      };

      latestResult.replaceChildren();
      latestResult.className = 'latest ' + code;
      latestResult.appendChild(makeElement('p', 'latest-order', getLatestOrderText(result)));
      latestResult.appendChild(makeElement('p', 'latest-message', result.message));
      latestResult.appendChild(makeElement('span', 'latest-code', result.code));

      history.unshift(result);
      if (history.length > 30) history.length = 30;
      renderHistory();
      beep(code === 'success' || code === 'cancel_success');
    }

    function showPendingResult(orderNo, action) {
      latestResult.replaceChildren();
      latestResult.className = 'latest resolving';
      latestResult.appendChild(makeElement('p', 'latest-order', orderNo));
      latestResult.appendChild(makeElement('p', 'latest-message', '読み取りました。照合中...'));
      latestResult.appendChild(makeElement('span', 'latest-code', action === 'cancel' ? 'cancel' : 'input'));
    }

    function renderHistory() {
      historyList.replaceChildren();
      history.forEach(function(item) {
        const card = makeElement('article', 'history-item ' + item.code, '');
        const head = makeElement('div', 'history-head', '');
        head.appendChild(makeElement('span', 'history-order', item.orderNo));
        head.appendChild(makeElement('span', 'history-time', item.timestamp));
        card.appendChild(head);
        card.appendChild(makeElement('p', 'history-message', item.message));
        const meta = makeElement('div', 'history-meta', '');
        meta.appendChild(makeElement('span', '', item.code));
        meta.appendChild(makeElement('span', '', '処理種別：' + item.actionLabel));
        card.appendChild(meta);
        historyList.appendChild(card);
      });
    }

    function normalizeResultCode(code) {
      const allowed = [
        'success', 'duplicate', 'cancel_success', 'cancel_not_done', 'not_target',
        'invalid_format', 'not_found', 'error', 'failure', 'jsonp_error'
      ];
      return allowed.indexOf(String(code)) >= 0 ? String(code) : 'failure';
    }

    function getDisplayMessage(code, fallback) {
      const messages = {
        success: '納品準備完了',
        duplicate: 'すでに完了済み',
        cancel_success: '準備完了を取り消しました',
        cancel_not_done: '取消不要：まだ準備完了になっていません',
        not_target: '出荷工程対象のため組立課対象外',
        not_found: '注文番号が見つかりません',
        invalid_format: '読み取り値が空です',
        error: '処理に失敗しました',
        failure: '処理に失敗しました',
        jsonp_error: '通信に失敗しました'
      };
      return messages[code] || String(fallback || '処理結果を取得できませんでした');
    }

    function getLatestOrderText(result) {
      if (result.code === 'success' || result.code === 'cancel_success') {
        return '〇 ' + result.orderNo;
      }
      return result.orderNo;
    }

    function makeElement(tagName, className, text) {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      element.textContent = text;
      return element;
    }

    function formatCurrentTime() {
      const now = new Date();
      const date = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      const time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
      return date + ' ' + time;
    }

    function showNotice(message, type) {
      notice.textContent = message;
      notice.className = 'notice ' + (type || '');
    }

    function showScanConfirmation() {
      scanFlash.classList.remove('show');
      void scanFlash.offsetWidth;
      scanFlash.classList.add('show');
    }

    function prepareAudio() {
      try {
        if (!audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioContext = new AudioContextClass();
        }
        if (audioContext && audioContext.state === 'suspended') {
          const resume = audioContext.resume();
          if (resume && typeof resume.catch === 'function') resume.catch(function() {});
        }
      } catch (error) {}
    }

    function beep(isSuccess) {
      try {
        prepareAudio();
        if (!audioContext) return;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.frequency.value = isSuccess ? 880 : 220;
        gain.gain.setValueAtTime(0.12, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.16);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.16);
      } catch (error) {}
    }
  </script>
</body>
</html>
